# Install as /etc/nginx/sites-available/gatewayops (inside nginx's http context).
# Keep these zone names unique to this application.
limit_req_zone $binary_remote_addr zone=gatewayops_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=gatewayops_login:1m rate=10r/m;

server {
    listen 80;
    server_name gatewayops.qidian7.de5.net;
    server_tokens off;
    client_max_body_size 8m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    limit_req_status 429;
    limit_req zone=gatewayops_requests burst=60 nodelay;

    # Only Cloudflare peers may supply the actual client IP.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # This vhost is exposed through Cloudflare HTTPS. No includeSubDomains:
    # sibling applications are outside the scope of this deployment.
    add_header Strict-Transport-Security "max-age=15552000" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace, do not append to an attacker-controlled forwarding chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_request_buffering on;

    location ~ (^|/)\. {
        return 404;
    }

    location = /api/auth/login {
        client_max_body_size 16k;
        limit_req zone=gatewayops_requests burst=60 nodelay;
        limit_req zone=gatewayops_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
    }
}
